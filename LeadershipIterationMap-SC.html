<title>Four Threads of Me</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: the photo is the map; handwritten chalk labels sit on it, a bead click zooms the photo and opens a reading panel beside (or below) it. Single dark look, chosen to sit with the walnut table. */
:root {
  color-scheme: dark;
  --ground: #1b1411;
  --ground-2: #261c17;
  --ink: #f4ede5;
  --muted: #c2b3a4;
  --chalk: #ffffff;
  --panel: rgba(27, 20, 17, 0.9);
  --line: rgba(244, 237, 229, 0.18);
  --t1: #5b86d6;
  --t2: #93c95a;
  --t3: #f2c230;
  --t4: #e8605a;
  --hand: "Architects Daughter", "Segoe Print", "Bradley Hand", cursive;
  --read: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
}
html, body { background: var(--ground); color: var(--ink); }
body {
  font-family: var(--read);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 12px; }
.stage {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3;
  overflow: hidden; border-radius: 6px; background: var(--ground-2);
}
.layer {
  position: absolute; inset: 0; transform-origin: 0 0;
  transition: transform 750ms cubic-bezier(.2,.7,.2,1);
}
.layer img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.bead {
  position: absolute; width: 6.5%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%; border: 0; background: transparent; cursor: pointer; padding: 0;
}
.bead::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.75); opacity: .0;
  animation: breathe 2.6s ease-in-out infinite;
}
.bead:hover::after, .bead:focus-visible::after { opacity: 1; animation: none; }
.bead:focus-visible { outline: none; }
.bead.active::after { opacity: 1; animation: none; border-width: 1px; }
@keyframes breathe { 0%,100% { opacity: 0; transform: scale(.9); } 50% { opacity: .7; transform: scale(1.12); } }

.labels { position: absolute; inset: 0; pointer-events: none; transition: opacity 350ms ease; }
.zoomed .labels { opacity: 0; }
.lab {
  position: absolute; font-family: var(--hand); color: var(--chalk); line-height: 1;
  font-size: clamp(13px, 1.9vw, 26px); font-weight: 400; white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 0 12px rgba(0,0,0,.35);
  transform: translate(-50%, 0);
}
button.lab { pointer-events: auto; background: none; border: 0; padding: 2px 6px; cursor: pointer; border-radius: 4px; }
button.lab:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
button.lab:focus-visible { outline: 1.5px dashed var(--chalk); outline-offset: 2px; }
.lab.quiet { font-size: clamp(12px, 1.65vw, 22px); color: rgba(255,255,255,.9); }
.lab.title { transform: none; font-family: "Josefin Sans", "Futura", "Century Gothic", sans-serif; text-transform: uppercase; letter-spacing: .05em; font-size: clamp(20px, 3.7vw, 50px); font-weight: 400; }
.lab.byline { transform: none; font-family: "Josefin Sans", "Futura", "Century Gothic", sans-serif; text-transform: uppercase; letter-spacing: .14em; font-size: clamp(12px, 1.7vw, 23px); font-weight: 400; color: rgba(255,255,255,.85); }

.panel {
  position: absolute; top: 4%; right: 3%; bottom: 4%; width: min(42%, 470px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  display: flex; flex-direction: column; min-width: 0;
  opacity: 0; transform: translateX(16px); pointer-events: none;
  transition: opacity 400ms ease 200ms, transform 400ms ease 200ms;
}
.zoomed .panel { opacity: 1; transform: none; pointer-events: auto; }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.swatch { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.role { font-family: var(--read); font-weight: 600; font-size: 20px; line-height: 1.25; text-transform: uppercase; letter-spacing: .05em; margin: 0; }
.armor { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
.close {
  margin-left: auto; align-self: flex-start; background: none; border: 1px solid var(--line); color: var(--ink);
  border-radius: 999px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; flex: none;
}
.close:hover, .close:focus-visible { border-color: var(--ink); outline: none; }
.panel-body { overflow-y: auto; padding: 14px 18px; display: grid; gap: 14px; min-width: 0; }
.part h3 { font-family: var(--read); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.part p { margin: 0; font-size: 16px; line-height: 1.6; }
.part.take p { font-family: var(--read); font-weight: 600; font-size: 18px; line-height: 1.45; color: var(--chalk); }
.panel-foot { display: flex; justify-content: space-between; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--line); }
.nav {
  background: none; border: 1px solid var(--line); color: var(--ink); font-family: var(--read);
  font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer;
}
.nav:hover, .nav:focus-visible { border-color: var(--ink); outline: none; }
.panel.paper { width: min(56%, 640px); }
.panel.paper .panel-foot { display: none; }
.panel.paper .swatch { background: conic-gradient(var(--t1) 0 25%, var(--t2) 0 50%, var(--t3) 0 75%, var(--t4) 0); }
.paper-text p { margin: 0 0 1em; font-size: 16px; line-height: 1.65; }
.paper-text p.fn { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.paper-text sup { font-size: .7em; }
.hint { font-family: "Josefin Sans", "Futura", "Century Gothic", sans-serif; font-weight: 400; font-size: 15px; letter-spacing: .05em; color: var(--muted); text-align: center; margin: 0; }

@media (max-width: 760px) {
  .panel {
    position: static; width: 100%; max-width: 100%; transform: none; display: none; margin-top: 0;
  }
  .panel.open { display: flex; opacity: 1; pointer-events: auto; }
  .role { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .layer, .panel, .labels { transition: none; }
  .bead::after { animation: none; opacity: .5; }
}
</style>

  <template id="paperTpl"><div class="paper-text"><p>I recently shared with a friend that I found it difficult to write about my leadership journey because I feel like I’m just at the beginning. They expressed their surprise, sharing that from their perspective I’ve had a lot of leadership experiences that have led me to where I am. I was raised to be completely dependent on others (I didn’t even have a social security number until I was 25), inside a religious cult in the Bible Belt. I had a child, found my queerness, left my marriage, bought a house, left another unhealthy marriage, bought another house. I co-founded a non-profit. I started a restaurant two weeks before COVID shut the world down. I walked away from the restaurant when I realized it wasn't healthy for me either. I took a job in higher education with zero experience. And now, approaching 40, I signed up for a one-year graduate program, taking 3 courses each semester. On paper, I suppose this does look like a leadership journey.</p>
<p>But this also feels like such a huge journey that I don’t know where to start. I’m still processing so much, I’m still learning and growing. With each of those life events, I have felt like I’m just starting over and discovering who I am and I don’t anticipate that part of my journey ever ending. I like that about my life and myself. I love change, learning, and growing. I love that I can keep discovering new parts of myself and moving towards a more authentic version of me. I’m learning how to give myself the love and acceptance that I didn’t have growing up, the love and acceptance that I’ve been searching for in others for my entire life.</p>
<p>I was raised in a system of conformity, of enforced silencing of self—being told that my heart was wicked and not to be trusted. This environment pushed me inward and forced me to really explore who I was and why. I didn’t feel like I belonged anywhere, so I was always searching for a place of my own. I learned to compartmentalize to survive an abusive environment that was determined to break my spirit. I learned to find moments of joy in any place I could—to find flecks of gold in the midst of shit.<sup>1</sup></p>
<p>Being raised in a system that is designed to keep you small, quiet, and obedient made it impossible to be honest or authentic. I tried my best to flow through the world with minimal disruption to myself or the people around me. The consequences of being seen were fatal, so I became very good at figuring out what was expected of me and being exactly that—nothing more and nothing less. When I finally took a step to be free by leaving my marriage and being openly queer, I had to let go of the weight of the expectations of everyone around me and live with the knowledge that I was being judged and condemned by the only community I had ever known. I had spent my life trying to avoid having my internal life visible and suddenly, my biggest fears were realized, and I discovered that instead of being devastated, I was free. If my story ended there, it would be a sufficient journey from hopelessness to freedom. But this isn’t where my story ends.</p>
<p>I continued to try to survive in a world that I wasn’t familiar with. I systematically disassembled my previous understanding of the world and tried to make sense of the new expectations that surrounded me. I said yes to opportunities, tested them out, sometimes felt stuck in them, but eventually learned that they were not quite right for me either. I have had to continually push through the fears of not knowing and try on new things to gain experience and knowledge.</p>
<p>When I was offered a chance to work part-time in my friend’s bar in 2019, I had no idea how to bartend. I said yes because I was curious and excited to try something new. I figured if I was terrible at it, I could quit and he’d easily find experienced people that would jump at the chance to be a part of the new bar. But I loved it. I picked it up quickly and discovered that the fast-paced, customer-focused, multi-tasking nature of bartending was my happy place. I bought a house half a mile from the bar and when the opportunity to step into an ownership role arose, I dove in head-first, despite my fear of walking away from a good-paying easy (i.e. boring) job. It was exhilarating to take control of my life in this way and even though my business partner and I ended up not seeing eye-to-eye, I do not regret my time owning Bar Margaret. I discovered that I could learn new things quickly, be a good boss, manage chaos well, and most of all, I learned that there are limits to how much toxic behavior I have to allow in a situation before I need to step away. Leaving my bar was just as scary as diving in was for me. I was walking away from a space and community I had poured myself into and made part of my identity. My dog’s picture still hangs in the front room and it remains named after her. I’m proud of what I built, even though I’m no longer associated with it. I’m also incredibly proud of myself for leaving. I didn’t stay and contort myself to please someone else. I asked for what I needed, and when it became clear that my needs could not be met in the situation, I prioritized myself and my family.</p>
<p>With a few details changed, this timeline fits many of my stories. They often follow this pattern of curiosity, saying yes to the exciting and scary unknown, discovering that I have abandoned myself to fit someone else’s (usually unstated) expectation, and then deciding to choose a different path for myself. What I’ve discovered is that life is iterative. Each thing I do is another step, another version of myself that I’m exploring. Each letting go is an embracing of my own truth. Each walking away is walking toward my next lesson.</p>
<p>Being raised in a restrictive environment that punished individuality and encouraged self-hatred has led to an uncompromising desire to lead with freedom and love. It has made me passionate about creating space and empowering others to trust themselves and find their own individual path. I’m still working through my own self-doubt and learning to trust myself in a world that doesn’t encourage individualism or self-confidence, especially for women. I’m thrilled that I currently have a job that allows me to be involved in supporting the growth and learning of others. It’s been a great opportunity for me to continue to find space where I can practice these leadership skills and continue to grow my vision for a thriving community of people who are interested in growing and learning and encouraging others to do the same.</p>
<p>Early on in my journey I often felt like I was untangling threads inside myself and it was my job to figure out how to make sense of it—how to make sense of myself in the world. Every step in my journey has been another thread breaking free of the tangle. Now, all these years later, I feel like I’m taking those untangled individual threads and weaving them into something. I’m slowly and meticulously creating something beautiful out of the tangled mess I was given. I’m excited to see the final product and I’m excited to use what I've learned to help others untangle the threads they’ve inherited as well. This is what leadership is to me—creating my own tapestry and helping others see the beauty in the threads they hold in their hands. I want to help people recognize the tangles as individual threads that they can make into whatever they choose.</p>
<p>As I look back at my list of things I’ve accomplished, I can see that I am actually well on my way in my leadership journey and I have a lot that I can be proud of. Over and over, I have made it through things that felt impossible and I will continue to do so. This personal exploration helps me see how far I’ve come and reminds me that future is unknown, but I’m looking forward to seeing what opportunities are still to come where I can truly lean into creating safe space for the people around me. I can help the world be a little bit of a kinder place to all and help others discover that they also are the source of the gold that they find in the world.</p>
<p class="fn"><sup>1</sup> This is a lovely analogy I’ve used with my therapist. The expanded version includes discovering that the flecks of gold were actually pieces of myself, and I only found them in the shit because I was choosing to <em>be in the shit</em>.</p></div></template>

<script>
const cycles = [
  { n: 1, role: "Step-parent", armor: "Control", color: "var(--t1)", x: .417, y: .663,
    approach: "In my mid-20s, I left a conservative Christian cult and became a step-parent to a pre-teen with big feelings. I only knew how to parent the way I was parented: with complete control, treating power as respect. He couldn't show feelings, and I couldn't show weakness.",
    friction: "The harder I held on to control, the more we fought. Our relationship was full of conflict and pain. When the marriage ended and I had space to look back, I could see that I had tried to force him to be someone he wasn't, and that I was playing out my own damaged relationship with my mother.",
    adaptation: "I wrote him a letter apologizing. With my own son, I've chosen to encourage him to express his feelings.",
    takeaway: "Healing my own story is part of leading well, because unexamined patterns get passed on." },
  { n: 2, role: "Business partner", armor: "Avoidance", color: "var(--t2)", x: .616, y: .667,
    approach: "My business partner was angry most of the time and didn't communicate his needs. In the chaos of running a restaurant, I managed everything around him and protected our employees from his anger. That meant I took the brunt of it.",
    friction: "I felt like I had to walk on eggshells, and I was stressed and overwhelmed all the time. Then one night he threw something in anger and it hit one of our employees. When I finally called out his behavior, he calmed down right away and apologized to everyone. The conflict I'd avoided for so long hadn't protected anyone, and it had built up so much that it was traumatic for me.",
    adaptation: "I gave him an ultimatum to get help, and when he wouldn't, I chose to prioritize my well-being and walk away.",
    takeaway: "When I avoid conflict, I'm not protecting anyone. I'm just choosing to carry the cost myself." },
  { n: 3, role: "Employee", armor: "Oversharing as vulnerability", color: "var(--t3)", x: .553, y: .329,
    approach: "After leaving the bar, I went to work for someone else. Determined not to fall back into silence and avoidance, I bared my soul: my weaknesses, my experiences, what I thought, and what I wanted. I wanted to be so upfront that I couldn't be misunderstood.",
    friction: "My new boss was just as avoidant as my business partner. Instead of the open communication I'd hoped for, my openness made her paranoid and more avoidant. She was new to being a boss, so I tried to be patient and help her through it, and I found myself making myself small to accommodate her moods and needs. We also became close friends, and neither of us had good boundaries.",
    adaptation: "Once again, I chose to prioritize my well-being and leave. In my next role, I stayed open about my work while keeping my personal life to myself.",
    takeaway: "Vulnerability works best with boundaries, both for me and for the people I share with." },
  { n: 4, role: "Co-parent", armor: "Silence", color: "var(--t4)", x: .647, y: .167,
    approach: "I was raised in a religious cult that taught men are the head of the household and women are to be submissive to the men in their lives. Even after I stopped believing that, I knew my co-parent still did. For years I stayed quiet to keep the peace. I compromised internally before I ever spoke, and I took on the mental and emotional labor because I didn't think he could.",
    friction: "I realized my silence was harming my son. He was reaching his own breaking point, and I knew I needed to step up for him.",
    adaptation: "I started telling my co-parent what I wanted without compromising in my head first. When he pushed back, I told him how much I had already compromised. I insisted and stopped backing down. Once I started speaking up, my son found his voice too.",
    takeaway: "The way I show up teaches more than anything I say." }
];

const stage = document.getElementById("stage");
const layer = document.getElementById("layer");
const panel = document.getElementById("panel");
const hint = document.getElementById("hint");
const beads = [...document.querySelectorAll(".bead")];
let current = -1;
let lastTrigger = null;

const narrow = () => window.matchMedia("(max-width: 760px)").matches;

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function zoomTo(c) {
  const s = narrow() ? 2.4 : 2.7;
  const cx = narrow() ? .5 : .29, cy = .5;
  let tx = cx - s * c.x, ty = cy - s * c.y;
  tx = Math.min(0, Math.max(1 - s, tx));
  ty = Math.min(0, Math.max(1 - s, ty));
  layer.style.transform = `translate(${tx * 100}%, ${ty * 100}%) scale(${s})`;
}

function open(i, trigger) {
  if (trigger) lastTrigger = trigger;
  panel.classList.remove("paper");
  current = (i + cycles.length) % cycles.length;
  const c = cycles[current];
  stage.classList.add("zoomed");
  zoomTo(c);
  beads.forEach((b, k) => b.classList.toggle("active", k === current));
  document.getElementById("swatch").style.background = c.color;
  document.getElementById("role").textContent = `${c.n}. ${c.role}`;
  document.getElementById("armor").textContent = c.armor;
  document.getElementById("body").innerHTML = [
    ["Approach", c.approach], ["Friction", c.friction], ["Adaptation", c.adaptation]
  ].map(([h, t]) => `<div class="part"><h3>${h}</h3><p>${esc(t)}</p></div>`).join("") +
    `<div class="part take"><h3>Takeaway</h3><p>${esc(c.takeaway)}</p></div>`;
  document.getElementById("body").scrollTop = 0;
  if (narrow()) { stage.after(panel); panel.classList.add("open"); }
  hint.hidden = true;
  document.getElementById("close").focus({ preventScroll: true });
}

function openPaper(trigger) {
  lastTrigger = trigger; current = -2;
  stage.classList.add("zoomed");
  const s = narrow() ? 2.2 : 2.4, cx = narrow() ? .5 : .2;
  let tx = Math.min(0, Math.max(1 - s, cx - s * .15)), ty = Math.min(0, Math.max(1 - s, .5 - s * .48));
  layer.style.transform = `translate(${tx * 100}%, ${ty * 100}%) scale(${s})`;
  beads.forEach(b => b.classList.remove("active"));
  panel.classList.add("paper");
  document.getElementById("swatch").style.background = "";
  document.getElementById("role").textContent = "Mining for Gold: Sarah Cochran’s Journey to Freedom";
  document.getElementById("armor").textContent = "INV 643 · March 4, 2026";
  document.getElementById("body").innerHTML = document.getElementById("paperTpl").innerHTML;
  document.getElementById("body").scrollTop = 0;
  if (narrow()) { stage.after(panel); panel.classList.add("open"); }
  hint.hidden = true;
  document.getElementById("close").focus({ preventScroll: true });
}
document.getElementById("paperBtn").addEventListener("click", e => { e.stopPropagation(); openPaper(e.currentTarget); });

function close() {
  current = -1;
  stage.classList.remove("zoomed");
  layer.style.transform = "";
  beads.forEach(b => b.classList.remove("active"));
  panel.classList.remove("open", "paper");
  if (panel.parentElement !== stage) stage.appendChild(panel);
  hint.hidden = false;
  if (lastTrigger) lastTrigger.focus({ preventScroll: true });
}

document.querySelectorAll("[data-i]").forEach(el =>
  el.addEventListener("click", e => { e.stopPropagation(); open(+el.dataset.i, el); }));
document.getElementById("close").addEventListener("click", close);
document.getElementById("prev").addEventListener("click", () => open(current - 1));
document.getElementById("next").addEventListener("click", () => open(current + 1));
layer.addEventListener("click", e => { if (current !== -1 && !e.target.closest(".bead")) close(); });
document.addEventListener("keydown", e => {
  if (current === -1) return;
  if (e.key === "Escape") close();
  if (current < 0) return;
  if (e.key === "ArrowRight") open(current + 1);
  if (e.key === "ArrowLeft") open(current - 1);
});
window.addEventListener("resize", () => {
  if (current === -1) return;
  if (current >= 0) zoomTo(cycles[current]);
  if (narrow()) { stage.after(panel); panel.classList.add("open"); }
  else { stage.appendChild(panel); panel.classList.remove("open"); }
});
</script>

</body></html>
